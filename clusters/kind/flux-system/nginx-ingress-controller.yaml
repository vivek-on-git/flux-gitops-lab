apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-ingress-controller
  namespace: flux-system
spec:
  interval: 1m

  path: ./clusters/kind/apps/echo-server/nginx-ingress-controller

  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  wait: true

dependsOn:
    - name: alb-controller
