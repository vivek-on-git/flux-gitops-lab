apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shared-alb
  namespace: flux-system
spec:
  interval: 1m

  path: ./clusters/kind/apps/echo-server/shared-alb

  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  wait: true

  dependsOn:
    - name: nginx-ingress-controller
