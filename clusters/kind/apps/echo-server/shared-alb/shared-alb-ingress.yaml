apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shared-alb
  namespace: ingress-nginx
  annotations:
    # AWS ALB Ingress Controller annotations
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # Listen on both HTTP and HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'

    # HTTP to HTTPS redirect (301)
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/ssl-policy: 'ELBSecurityPolicy-TLS-1-2-2017-01'

    # ACM Certificate ARN - SHARED for all applications
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-south-1:824756206670:certificate/20f125a4-290b-4f67-86aa-df4e149387a6'

    # Backend protocol to nginx controller (HTTP)
    alb.ingress.kubernetes.io/backend-protocol: 'HTTP'

    # Health check settings for the nginx controller
    alb.ingress.kubernetes.io/healthcheck-path: '/healthz'
    alb.ingress.kubernetes.io/healthcheck-protocol: 'HTTP'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'

    # Tags for the ALB
    alb.ingress.kubernetes.io/tags: 'Environment=production,Name=shared-alb,Type=shared'

    # Load balancer attributes
    alb.ingress.kubernetes.io/load-balancer-attributes: 'idle_timeout.timeout_seconds=60,deletion_protection.enabled=false'

spec:
  ingressClassName: alb
  rules:
  # Default catch-all route - routes to nginx controller
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-ingress-nginx-ingress-controller
            port:
              number: 80

  # Add domain-specific rules here for different applications
  # Each rule will route through nginx to different backend services

  # Example: echoserver on main domain
  - host: "*.dev1.vivekoncloud.dpdns.org"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-ingress-nginx-ingress-controller
            port:
              number: 80
