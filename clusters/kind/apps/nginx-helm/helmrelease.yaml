apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: default
spec:
  interval: 5m

  chart:
    spec:
      chart: nginx
      version: "19.1.1"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    replicaCount: 1
    service:
      type: ClusterIP

