apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: default
spec:
  interval: 5m

  chart:
    spec:
      chart: nginx
      version: "22.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    service:
      type: ClusterIP
