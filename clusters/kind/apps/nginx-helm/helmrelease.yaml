apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: default
spec:
  interval: 5m

  chart:
    spec:
      chart: podinfo
      version: "6.9.x"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system

  values:
    replicaCount: 1
