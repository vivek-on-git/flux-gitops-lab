apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-alb
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/eks/apps/echo-server/shared-alb
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: aws-load-balancer-controller
