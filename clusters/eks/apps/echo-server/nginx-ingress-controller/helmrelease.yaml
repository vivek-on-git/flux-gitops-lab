apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: ingress-nginx

spec:
  interval: 30m

  chartRef:
    kind: OCIRepository
    name: bitnami-nginx-ingress-controller
    namespace: flux-system

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      strategy: rollback

  values:

    # ------------------------------------------------------------
    # NGINX Ingress Controller
    # Chart 12.0.7 -> Application 1.13.1
    #
    # DO NOT override image/tag here.
    # Let chart 12.0.7 use its corresponding image.
    # ------------------------------------------------------------

    replicaCount: 4

    image:
      registry: docker.io
      repository: bitnamilegacy/nginx-ingress-controller
      pullPolicy: IfNotPresent
      tag: "1.13.1-debian-12-r1"

    defaultBackend:
      image:
        registry: docker.io
        repository: bitnamilegacy/nginx
        pullPolicy: IfNotPresent
        tag: "1.29.1-debian-12-r0"
    # ------------------------------------------------------------
    # Global security
    # ------------------------------------------------------------

    global:
      security:
        allowInsecureImages: true


    # ------------------------------------------------------------
    # ServiceAccount
    # ------------------------------------------------------------

    serviceAccount:
      create: true
      name: nginx-ingress


    # ------------------------------------------------------------
    # Service
    #
    # AWS ALB is managed by AWS Load Balancer Controller.
    # NGINX itself therefore remains ClusterIP.
    # ------------------------------------------------------------

    service:
      type: ClusterIP
      port: 80
      targetPort: 80
      annotations: {}


    # ------------------------------------------------------------
    # NGINX configuration
    # ------------------------------------------------------------

    config:
      http-redirect-code: "301"
      server-name-hash-bucket-size: "256"
      proxy-body-size: "10m"

      # Required when NGINX is behind the AWS ALB and
      # the original client protocol is supplied through
      # X-Forwarded-Proto.
      use-forwarded-headers: "true"

      compute-full-forwarded-for: "true"

      # ALB -> NGINX is normal HTTP.
      use-proxy-protocol: "false"


    # ------------------------------------------------------------
    # Pod security context
    # ------------------------------------------------------------

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      fsGroup: 1001


    # ------------------------------------------------------------
    # Container security context
    # ------------------------------------------------------------

    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false

      capabilities:
        add:
          - NET_BIND_SERVICE

        drop:
          - ALL


    # ------------------------------------------------------------
    # Resources
    # ------------------------------------------------------------

    resources:
      requests:
        cpu: 250m
        memory: 256Mi

      limits:
        cpu: 500m
        memory: 512Mi


    # ------------------------------------------------------------
    # Horizontal Pod Autoscaler
    # ------------------------------------------------------------

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5

      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80


    # ------------------------------------------------------------
    # Node placement
    # ------------------------------------------------------------

    nodeSelector:
      kubernetes.io/os: linux

    tolerations: []


    # ------------------------------------------------------------
    # Pod anti-affinity
    #
    # Prefer spreading NGINX replicas across nodes.
    # ------------------------------------------------------------

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:

          - weight: 100

            podAffinityTerm:

              labelSelector:
                matchExpressions:

                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - nginx-ingress

              topologyKey: kubernetes.io/hostname


    # ------------------------------------------------------------
    # Metrics
    # ------------------------------------------------------------

    metrics:
      enabled: true

      serviceMonitor:
        enabled: false
