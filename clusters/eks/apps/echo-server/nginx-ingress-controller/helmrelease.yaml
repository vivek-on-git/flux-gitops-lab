apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: ingress-nginx
spec:
  interval: 5m

  chart:
  spec:
    chart: ingress-nginx
    sourceRef:
      kind: HelmRepository
      name: ingress-nginx
      namespace: flux-system
    interval: 1h

  values:
    replicaCount: 2

    global:
      security:
        allowInsecureImages: true

    serviceAccount:
      create: true
      name: nginx-ingress

    service:
      type: ClusterIP
      port: 80
      targetPort: 80
      annotations: {}

    config:
      http-redirect-code: "301"
      server-name-hash-bucket-size: "256"
      proxy-body-size: "10m"
      use-forwarded-headers: "true"
      compute-full-forwarded-for: "true"
      use-proxy-protocol: "false"

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      fsGroup: 1001

    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - NET_BIND_SERVICE
        drop:
          - ALL

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

    nodeSelector:
      kubernetes.io/os: linux

    tolerations: []

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - nginx-ingress
              topologyKey: kubernetes.io/hostname

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
