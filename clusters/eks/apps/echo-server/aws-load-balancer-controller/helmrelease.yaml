apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  interval: 10m

  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: eks
        namespace: kube-system

  values:
    clusterName: dev-dev1-eks

    serviceAccount:
      create: false
      name: aws-load-balancer-controller

    aws:
      region: ap-south-1

    vpcId: vpc-0f549138b11abf13e
